spring.application.name=platform-api
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=${PLATFORM_API_DB_URL:jdbc:sqlite:./data/platform_api.db}
spring.datasource.driver-class-name=${PLATFORM_API_DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${PLATFORM_API_DB_USERNAME:}
spring.datasource.password=${PLATFORM_API_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

app.auth.jwt.secret=change-me-in-env-to-at-least-32-characters
app.auth.access-token-minutes=${APP_AUTH_ACCESS_TOKEN_MINUTES:120}
app.auth.refresh-token-days=${APP_AUTH_REFRESH_TOKEN_DAYS:30}

app.cors.allowed-origins=http://localhost:3000

app.ai-engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8080}
# El AI Engine monta todas sus rutas (incluidas /internal/ai/*) bajo /api.
app.ai-engine.path-prefix=${AI_ENGINE_PATH_PREFIX:/api}
app.ai-engine.connect-timeout=${AI_ENGINE_CONNECT_TIMEOUT:3s}
app.ai-engine.read-timeout=${AI_ENGINE_READ_TIMEOUT:30s}
app.ai-engine.shared-secret=${AI_ENGINE_SHARED_SECRET:}
# TTL del cache de usuario+organizaciones por token al proxear hacia el AI Engine (0 = sin cache).
app.ai-engine.identity-cache-seconds=${AI_ENGINE_IDENTITY_CACHE_SECONDS:30}
app.integration.service-token=${PLATFORM_INTERNAL_SERVICE_TOKEN:}
